<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downzilla - Sign in with Google</title>

    <script src="https://www.downzilla.buzz/js/auth/inScript.js"></script>
    <script src="https://accounts.google.com/gsi/client" defer></script>

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#3B1F52;
    padding:20px;
}

.auth-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    padding:45px 30px;
    text-align:center;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
}

.top-line{
    width:70px;
    height:5px;
    background:#9D73D7;
    border-radius:20px;
    margin:0 auto 28px;
}

.auth-card h1{
    font-size:28px;
    color:#2b2b2b;
    margin-bottom:35px;
    line-height:1.4;
    font-weight:700;
}

#gbtns{
    display:flex;
    justify-content:center;
    margin-bottom:28px;
}

.footer{
    color:#777;
    font-size:14px;
}
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">

            <div class="top-line"></div>

            <h1>Continue signing in to Downzilla</h1>

            <div id="gbtns">
                <div id="g_id_onload"
                    data-client_id="1024052995708-4th7j14oi5dj9b0g2r18rfb8et0djoji.apps.googleusercontent.com"
                    data-context="signin"
                    data-callback="handleCredentialResponse"
                    data-auto_prompt="false">
                </div>

                <div class="g_id_signin"
                    data-type="standard"
                    data-theme="outline"
                    data-size="large"
                    data-shape="pill"
                    data-text="continue_with"
                    data-logo_alignment="left">
                </div>
            </div>

            <p class="footer">
                Secure authentication powered by Google
            </p>

        </div>
    </div>
</body>
</html>
