<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downzilla - Sign in with Google</title>

    <script src="../js/auth/inScript.js"></script>
    <script src="https://accounts.google.com/gsi/client" defer></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
        }

        .card{
            width:90%;
            max-width:420px;
            background:#fff;
            border-radius:20px;
            padding:40px 30px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.2);
        }

        .logo{
            width:80px;
            height:80px;
            margin:0 auto 20px;
            border-radius:50%;
            background:#2563eb;
            display:flex;
            justify-content:center;
            align-items:center;
            color:#fff;
            font-size:35px;
            font-weight:bold;
            box-shadow:0 8px 20px rgba(37,99,235,.35);
        }

        h1{
            font-size:28px;
            color:#1e293b;
            margin-bottom:10px;
        }

        p{
            color:#64748b;
            font-size:15px;
            line-height:1.6;
            margin-bottom:30px;
        }

        #gbtns{
            display:flex;
            justify-content:center;
        }

        .footer{
            margin-top:25px;
            color:#94a3b8;
            font-size:13px;
        }

        @media(max-width:480px){
            .card{
                padding:30px 20px;
            }

            h1{
                font-size:24px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        D
    </div>

    <h1>Welcome to Downzilla</h1>

    <p>
        Continue securely with your Google account to
        download, stream and share content across 200+ supported websites.
    </p>

    <div
        id="g_id_onload"
        data-client_id="1024052995708-4th7j14oi5dj9b0g2r18rfb8et0djoji.apps.googleusercontent.com"
        data-context="signin"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false">
    </div>

    <div id="gbtns">
        <div
            class="g_id_signin"
            data-type="standard"
            data-theme="filled_blue"
            data-shape="pill"
            data-size="large"
            data-text="continue_with"
            data-logo_alignment="left"
            data-width="320">
        </div>
    </div>

    <div class="footer">
        By continuing, you agree to Downzilla's Terms of Service and Privacy Policy.
    </div>

</div>

</body>
</html>
